name: CI - feature/video-upload

on:
  push:
    branches: ["main", "feature/video-upload"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
